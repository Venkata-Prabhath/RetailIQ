services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retailiq
      POSTGRES_USER: retailiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailiq_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["retailiq_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailiq -d retailiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports: ["8501:8501"]
    environment:
      DATABASE_URL: postgresql+psycopg://retailiq:${POSTGRES_PASSWORD:-retailiq_local_only}@postgres:5432/retailiq
      DATA_SOURCE: ${DATA_SOURCE:-csv}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
volumes:
  retailiq_pgdata:
