services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retailiq
      POSTGRES_USER: retailiq
      POSTGRES_PASSWORD: retailiq_local_only
    ports: ["5432:5432"]
    volumes: ["retailiq_pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    ports: ["8501:8501"]
    environment:
      DATABASE_URL: postgresql+psycopg://retailiq:retailiq_local_only@postgres:5432/retailiq
    depends_on: [postgres]
volumes:
  retailiq_pgdata:
